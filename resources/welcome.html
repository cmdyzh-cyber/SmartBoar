<!doctype html><html lang="zh"><meta charset="utf-8"><body style="font-family:-apple-system;font-size:14px;line-height:1.6"><h2>聪明的野猪 · 老打印机助手</h2><p>自动识别 USB 打印机，按完整型号匹配驱动与修复方案。</p><p>如果只连接了一台具有已验证方案的打印机，安装程序会备份原设置并自动完成设置。存在旧任务、连接了多台设备或没有适配方案时，可在应用中查看状态。</p><p>安装后，从“应用程序”打开“聪明的野猪”，打印一页测试并确认真实出纸。</p><p><b>试用版 0.2：</b>Apple Silicon / macOS 14+。当前可自动设置 HP Laser 108a；另有 10 个老机型的识别条目，尚未开放安装。新版安装包还需实际安装验证。</p></body></html>
