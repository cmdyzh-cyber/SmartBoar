<!doctype html><html lang="zh"><meta charset="utf-8"><body style="font-family:-apple-system;font-size:14px;line-height:1.6"><h2>软件已安装</h2><p>请从“应用程序”打开 <b>聪明的野猪</b>。</p><p>软件会自动检测 USB 打印机。显示“可自动设置”时点击“自动设置”；显示“已设置”时打印一页测试。</p><p>显示“待适配”时，可以保存诊断信息，供后续增加机型支持。诊断信息不会自动上传。</p><p>需要恢复时，点击“恢复原设置”。</p></body></html>
